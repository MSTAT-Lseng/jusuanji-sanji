<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>答题程序</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="layout">
      <header class="panel top">
        <h1>网络技术试题</h1>
        <div class="top-right">
          <div
            id="progress"
            class="progress"
            role="button"
            tabindex="0"
            aria-label="点击跳转到指定题号"
            title="点击跳转到指定题号"
          >
            加载中...
          </div>
          <div id="jump-box" class="jump-box hidden">
            <input id="jump-input" class="jump-input" type="number" min="1" inputmode="numeric" />
            <button id="jump-go-btn" type="button">跳转</button>
            <button id="jump-cancel-btn" type="button">取消</button>
          </div>
        </div>
      </header>

      <section class="panel">
        <article id="question-title" class="question-title"></article>
      </section>

      <section id="options-panel" class="panel">
        <h2>选项</h2>
        <form id="options-form" class="options-form"></form>
      </section>

      <section class="panel">
        <div class="actions">
          <button id="prev-btn" type="button">上一题</button>
          <button id="next-btn" type="button">下一题</button>
          <button id="submit-btn" type="button">提交答案</button>
          <button id="show-analysis-btn" type="button">显示解析</button>
        </div>
        <div id="result" class="result"></div>
        <h2>解析</h2>
        <pre id="analysis" class="analysis"></pre>
      </section>
    </div>

    <script src="renderer.js" defer></script>
  </body>
</html>
